# The production profile (task 0.26a, ADR-0008): one installation per region, on one machine. It goes over docker-compose.yml
# (the backing services: PostgreSQL, Valkey, Keycloak, SeaweedFS, pinned there) and adds the ITRMS processes from the released
# images (infra/docker/Dockerfile). `node tools/prod-stack.mjs up` runs it with its settings (infra/compose/.env.production)
# and the certificates (infra/compose/tls); docs/operations/installation.md is the operator's runbook.
#
#   docker compose -f docker-compose.yml -f production.yml --env-file .env.production up -d
#
# Networks: the processes, the databases and Keycloak share `default`, which is internal (no route out). Nginx (`edge`) is
# on `public` too, with ports 80 and 443; the API's calls out (the national platform, SMS) go through `egress`, the only other
# service with a route out. The object store sits alone on `storage` (internal too): its master, volume and filer ports have
# no authentication, so the processes reach only its S3 port, through the `s3` gate. Keycloak's administration answers on
# the machine's loopback through the `admin` gate, which gives Keycloak itself no route out.

x-app: &app
  restart: unless-stopped
  networks: [default]
  volumes:
    # the certificate authority the processes also trust (a bureau's own, or a test installation's): that file only
    - ${ITRMS_TLS_DIR:-./tls}/ca.pem:/etc/itrms/tls/ca.pem:ro
  depends_on: &app-depends
    postgres:
      condition: service_healthy

x-env: &env
  NODE_ENV: production
  TZ: Africa/Addis_Ababa
  NODE_EXTRA_CA_CERTS: /etc/itrms/tls/ca.pem
  # Node's own proxy support (fetch): out only through egress, and never for what is on the stack's network
  NODE_USE_ENV_PROXY: '1'
  HTTPS_PROXY: http://egress:3128
  HTTP_PROXY: http://egress:3128
  NO_PROXY: postgres,valkey-queues,valkey-sessions,keycloak,seaweedfs,api,web,edge,app.${ITRMS_DOMAIN:?},verify.${ITRMS_DOMAIN:?},localhost,127.0.0.1

x-personal: &personal
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?}
  FIELD_KEYS: ${FIELD_KEYS:?}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?}

x-store: &store
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: ${S3_BUCKET:-itrms}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_PUBLIC_PATH: /files

x-images:
  api: &api-image
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-api:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: api }

services:
  # the databases and the queues: no host ports in production
  postgres:
    ports: !reset []
    # with pgBackRest (task 0.26b1): every WAL segment archived to the repository host, which pulls the backups. The archive
    # command itself is set by `prod-stack up` (ALTER SYSTEM, kept in the data directory) once the stanza exists: the first
    # start's initialization never waits on the repository host
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-postgres:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: postgres }
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
    volumes:
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/ca.pem:/run/pgbackrest-tls/ca.pem:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/postgres.crt:/run/pgbackrest-tls/postgres.crt:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/postgres.key:/run/pgbackrest-tls/postgres.key:ro
  valkey-queues:
    ports: !reset []
  valkey-sessions:
    ports: !reset []
  seaweedfs:
    ports: !reset []
    networks:
      storage:
        aliases: [objectstore]
  mailpit:
    profiles: [development]

  keycloak:
    command: ['start']
    environment:
      # its sign-in pages are on the app's hostname, under /auth (Nginx routes them); its admin console is internal only
      KC_HOSTNAME: https://app.${ITRMS_DOMAIN:?}/auth
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}/auth
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
    extra_hosts: !reset []
    ports: !reset []

  # the object store's S3 port, and only that, on the stack's network (under the name the processes use)
  s3:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-gate:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: gate }
    environment:
      GATE_ROUTES: 8333=${ITRMS_S3_STORE:-objectstore}:8333
    networks:
      default:
        aliases: [seaweedfs]
      storage:
    depends_on:
      seaweedfs:
        condition: service_healthy

  # Keycloak's administration, on the machine's loopback only (over SSH), and its setup by tools/prod-stack.mjs
  admin:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-gate:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: gate }
    environment:
      GATE_ROUTES: 8080=keycloak:8080
    ports:
      - 127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080
    networks: [default, public]
    depends_on: [keycloak]

  # the schema's migrations (the upgrade order: backup → migrate → restart, ADR-0008); `docker compose run --rm migrate`
  migrate:
    <<: [*app, *api-image]
    restart: 'no'
    profiles: [setup]
    command: ['node', '--enable-source-maps', 'dist/migrate.cjs']
    environment:
      <<: *env
      DATABASE_MIGRATE_URL: postgres://itrms_owner:${ITRMS_OWNER_PASSWORD:?}@postgres:5432/itrms

  # the seeds (an installation's org tree, catalogue and users; the demo's data), as the operator runs them
  setup:
    <<: [*app, *api-image]
    restart: 'no'
    profiles: [setup]
    command: ['node', '--enable-source-maps', 'dist/seed.cjs']
    environment:
      <<: [*env, *personal]
      DATABASE_MIGRATE_URL: postgres://itrms_owner:${ITRMS_OWNER_PASSWORD:?}@postgres:5432/itrms
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_IDENTITY_ADMIN_SECRET:?}

  api:
    <<: [*app, *api-image]
    environment:
      <<: [*env, *personal, *store]
      DATABASE_URL: postgres://itrms_app:${ITRMS_APP_PASSWORD:?}@postgres:5432/itrms
      PORT: '4000'
      # on the stack's network, for Nginx (the default is the machine's own loopback)
      HOST: 0.0.0.0
      # what the BFF and Nginx say a request came from (X-Forwarded-For), believed from the stack's own network only
      TRUSTED_PROXIES: ${ITRMS_SUBNET:-172.29.0.0/24}
      OIDC_ISSUER: https://app.${ITRMS_DOMAIN:?}/auth/realms/itrms
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: [*app, *api-image]
    command: ['node', '--enable-source-maps', 'dist/worker.cjs']
    environment: &worker-env
      <<: [*env, *personal, *store]
      DATABASE_URL: postgres://itrms_app:${ITRMS_APP_PASSWORD:?}@postgres:5432/itrms
      DATABASE_SYSTEM_URL: postgres://itrms_system:${ITRMS_SYSTEM_PASSWORD:?}@postgres:5432/itrms
      VALKEY_QUEUES_URL: redis://valkey-queues:6379/0
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_IDENTITY_ADMIN_SECRET:?}
    depends_on:
      <<: *app-depends
      valkey-queues:
        condition: service_healthy

  worker-documents:
    <<: *app
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-documents:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: documents }
    # Chromium's memory is not Node's: the container's limit keeps a heavy page from taking the machine
    mem_limit: ${ITRMS_DOCUMENTS_MEMORY:-1g}
    environment:
      # the PDF worker's own: no identity administration (it never needs Keycloak's secret)
      <<: [*env, *personal, *store]
      DATABASE_URL: postgres://itrms_app:${ITRMS_APP_PASSWORD:?}@postgres:5432/itrms
      DATABASE_SYSTEM_URL: postgres://itrms_system:${ITRMS_SYSTEM_PASSWORD:?}@postgres:5432/itrms
      VALKEY_QUEUES_URL: redis://valkey-queues:6379/0
      VERIFY_BASE_URL: https://verify.${ITRMS_DOMAIN:?}
      # a container gives Chromium no sandbox of its own; it renders our templates only, offline
      CHROME_NO_SANDBOX: '1'
    depends_on:
      <<: *app-depends
      valkey-queues:
        condition: service_healthy

  web:
    <<: *app
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-web:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: web }
    environment:
      <<: *env
      APP_ORIGIN: https://app.${ITRMS_DOMAIN:?}
      API_URL: http://api:4000
      OIDC_ISSUER: https://app.${ITRMS_DOMAIN:?}/auth/realms/itrms
      OIDC_CLIENT_ID: itrms-web
      OIDC_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?}
      FILES_UPSTREAM: http://seaweedfs:8333
      SESSION_VALKEY_URL: redis://valkey-sessions:6379/0
      SESSION_KEYS: ${SESSION_KEYS:?}
    depends_on:
      valkey-sessions:
        condition: service_healthy

  edge:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-edge:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: edge }
    environment:
      ITRMS_DOMAIN: ${ITRMS_DOMAIN:?}
    volumes:
      - ${ITRMS_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    ports:
      - ${ITRMS_HTTP_PORT:-80}:80
      - ${ITRMS_HTTPS_PORT:-443}:443
    networks:
      public:
      default:
        # the processes reach the realm and the verifier by their public names, through Nginx, as browsers do
        aliases: ['app.${ITRMS_DOMAIN:?}', 'verify.${ITRMS_DOMAIN:?}']
    depends_on: [web, api, keycloak, s3]

  # the pgBackRest repository host (ADR-0012, ADR-0031 item 13): on site a second machine; here, to show it whole, a container
  # with its own volume. It pulls the backups over mutual TLS, and its repository is encrypted
  backup:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-backup:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: backup }
    environment:
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?}
      TZ: Africa/Addis_Ababa
    volumes:
      - pgbackrest-repo:/var/lib/pgbackrest
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/ca.pem:/run/pgbackrest-tls/ca.pem:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/backup.crt:/run/pgbackrest-tls/backup.crt:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/backup.key:/run/pgbackrest-tls/backup.key:ro
    networks: [default]

  # the files' backups (task 0.26b2, ADR-0031 item 13). On site the three run on the backup machine:
  # a second store, kept a copy of the bucket as it changes (filer.sync, one way, deletions included)
  # with the store's S3 port and credentials, so that the processes can be pointed at it (ITRMS_S3_STORE=replica, §8)
  replica:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"itrms","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      TZ: Africa/Addis_Ababa
    volumes:
      - replica-data:/data
    networks: [storage]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/'
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  files-sync:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ['weed']
    command:
      - filer.sync
      - -a=objectstore:8888
      - -b=replica:8888
      # the stored files only (files/): an upload waiting or rejected in quarantine/ is never copied
      - -a.path=/buckets/itrms/files
      - -b.path=/buckets/itrms/files
      - -isActivePassive
    depends_on:
      seaweedfs: { condition: service_healthy }
      replica: { condition: service_healthy }
    networks: [storage]

  # the bucket mirrored as plain files, a restic snapshot of them every night to the append-only repository
  files-backup:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-files-backup:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: files-backup }
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_SERVER_PASSWORD: ${RESTIC_SERVER_PASSWORD:?}
      TZ: Africa/Addis_Ababa
    volumes:
      - files-mirror:/mirror
      - ${ITRMS_FILES_TLS_DIR:-./files-tls}/ca.pem:/run/files-tls/ca.pem:ro
    depends_on:
      seaweedfs: { condition: service_healthy }
      restic: { condition: service_healthy }
    networks: [storage]

  # restic's rest-server: clients add snapshots, never remove one; the retention runs on its side
  restic:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-restic:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: restic }
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_SERVER_PASSWORD: ${RESTIC_SERVER_PASSWORD:?}
      TZ: Africa/Addis_Ababa
    volumes:
      - restic-repo:/data
      - ${ITRMS_FILES_TLS_DIR:-./files-tls}/restic.crt:/run/files-tls/restic.crt:ro
      - ${ITRMS_FILES_TLS_DIR:-./files-tls}/restic.key:/run/files-tls/restic.key:ro
    networks: [storage]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8000']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # the restore drill's scratch database (`node tools/prod-stack.mjs drill`): the latest backup, recovered, nothing archived
  drill:
    profiles: [drill]
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-postgres:${ITRMS_VERSION:-local}
    entrypoint: ['itrms-pgbackrest', 'drill']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # the restore point the drill made in its snapshot of the live database (prod-stack drill)
      DRILL_TARGET: ${DRILL_TARGET:-}
      TZ: Africa/Addis_Ababa
    volumes:
      - drill-data:/var/lib/postgresql/data
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/ca.pem:/run/pgbackrest-tls/ca.pem:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/drill.crt:/run/pgbackrest-tls/drill.crt:ro
      - ${ITRMS_BACKUP_TLS_DIR:-./backup-tls}/drill.key:/run/pgbackrest-tls/drill.key:ro
    networks: [default]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d itrms']
      interval: 5s
      timeout: 5s
      retries: 12
      # the restore runs before PostgreSQL starts: hours for a large database, not counted as failures
      start_period: 6h
      start_interval: 5s

  # the only way out (the national platform, SMS gateways): HTTPS to the hosts the installation allows
  egress:
    restart: unless-stopped
    image: ${ITRMS_REGISTRY:-ghcr.io/wwwabebayehualaro-ai}/itrms-egress:${ITRMS_VERSION:-local}
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: egress }
    environment:
      ITRMS_EGRESS_ALLOW: ${ITRMS_EGRESS_ALLOW:-}
    networks: [default, outside]

networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: ${ITRMS_SUBNET:-172.29.0.0/24}
  storage:
    internal: true
  public:
  outside:

volumes:
  pgbackrest-repo:
  drill-data:
  replica-data:
  files-mirror:
  restic-repo:
