# Shared proxy settings (included by itrms.conf.template).
proxy_http_version 1.1;
proxy_set_header Host $host;
# the edge is the first proxy: what a client sent in these is never passed on (security review 0.26c1 A4, A5). Keycloak
# and the API both read the client's address from here; the request id is the edge's own
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 120s;
