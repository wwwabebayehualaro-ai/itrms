# The object store behind /files (task 0.15): the store checks each signature as the API made it, for its own address,
# so the Host is the store's; the body streams through unbuffered (uploads of up to 16 MiB, parts of 8 MiB).
proxy_set_header Host seaweedfs:8333;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_request_buffering off;
proxy_buffering off;
proxy_http_version 1.1;
# nothing of the store's own about itself goes back to the browser
proxy_hide_header Server;
proxy_hide_header X-Amz-Request-Id;
proxy_hide_header X-Amz-Id-2;
