# Released images (task 0.26a, ADR-0008): on a version tag, CI builds the images and publishes them to the registry, where an
# installation pulls them (infra/compose/production.yml, ITRMS_VERSION). The same Dockerfile as the production-profile job.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        target: [api, documents, web, edge, egress]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish itrms-${{ matrix.target }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/itrms-${{ matrix.target }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.vendor=ABANEXUS SOFTWARE DEVELOPMENT PLC
