# Pull-request checks (docs/engineering/testing-strategy.md §3). Actions are pinned to exact releases at least two weeks
# old (tech-stack version rule); Renovate pins them to
# commit digests (renovate.json: helpers:pinGitHubActionDigests).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled, so every commit on main gets a complete scan.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: lint · typecheck · test · build · boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0 # version from package.json "packageManager"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Slice shape
        run: pnpm check:slices
      - name: Layer boundaries
        run: pnpm boundaries
      - name: Catalogues complete in Amharic and English
        run: pnpm i18n:check
      - name: Boundary fixtures and tool tests
        run: pnpm test:tools
      - name: Formatting
        run: pnpm format:check
      - name: Lint, typecheck, test, build
        # at most 3 tasks at once: type-aware ESLint, tsc and the Nest/Vite builds take 1-2 GB each, and the default (10)
        # runs a 4-core, 7-16 GB runner (and the local CI container, 6 GB) out of memory
        run: pnpm turbo run lint typecheck test build --concurrency=3
      - name: Known vulnerabilities in dependencies (pnpm audit)
        run: pnpm audit --audit-level high

  stories:
    name: stories · axe in every theme and density · visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Chromium and its libraries come from the image; the fonts are the repository's own (bundled Noto), so the visual
    # baselines made in this image (pnpm ci:local --jobs stories --update-visual) match here.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      # The runner mounts /github/home as another user, and swc refuses a native cache under it; /root is the container's
      SWC_NATIVE_BINDING_CACHE: /root/.cache/swc-native
      # The checkout belongs to the runner user, not the container's root, and git (lefthook install) refuses it. Config
      # from the environment is command scope, where git honours safe.directory; the container holds only this checkout
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Build Storybook
        run: pnpm --filter @itrms/ui build-storybook
      - name: Every story with axe and its checks, in every theme and density (headless Chromium)
        run: pnpm --filter @itrms/ui test:stories
      - name: Visual baselines (am and en, light, comfortable)
        run: pnpm --filter @itrms/ui test:visual
      # A missing baseline is written in place and a changed one leaves its diff in test-results: both are what this
      # image renders, to review before committing (as from pnpm ci:local --jobs stories --update-visual)
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-results
          path: |
            packages/ui/visual/__screenshots__
            packages/ui/visual/test-results
            packages/ui/test-results
          retention-days: 7

  infra:
    name: dev stack + S3 contract suite (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Start the dev stack (all services healthy)
        run: pnpm dev:infra --observability
      - name: The stack works end to end (seeds, storage isolation, telemetry, GlitchTip database)
        run: pnpm dev:infra:check
      - name: Integration tests (S3 contract suite)
        run: pnpm test:int
      - name: Container logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env --profile observability logs --tail 200
  perf:
    # the NFR timings on 10^6 generated rows with EXPLAIN under RLS (tasks 0.14, 0.16b); the reference server repeats
    # them in 0.26
    name: performance (10^6 rows, EXPLAIN under RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - name: Performance tests (PostgreSQL 16 in a container)
        run: pnpm --filter @itrms/api test:perf
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        # Values reach the shell as environment variables, never inlined into the script.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$SHA"            # a new branch: everything reachable from the pushed commit
          else
            RANGE="$BEFORE..$SHA"   # every commit of the push, not only its tip
          fi
          IMAGE="zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
          docker run --rm -v "$PWD:/repo" "$IMAGE" git /repo --redact --no-banner --log-opts="$RANGE"

  trivy:
    name: dependencies and config (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (commit pin: its tags were re-published on 2026-03-20)
        with:
          # the Trivy release tools/ci-local.mjs pins (TRIVY_IMAGE); the action's default reads only the first document
          # of pnpm-lock.yaml
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # The legacy Digital File Cabinet code is retired in tasks 0.4–0.6 and is not scanned until then.
          skip-dirs: Backend,contracts,features,tools/boundaries/fixtures
          list-all-pkgs: true
          format: json
          output: trivy.json
      - name: Trivy findings and coverage
        # Prints what Trivy found (the JSON output replaces its table). pnpm-lock.yaml has two YAML documents, so the
        # job also fails if Trivy read only the first one and listed almost none of the workspace's dependencies.
        if: always()
        run: node tools/ci/trivy-summary.mjs trivy.json vitest eslint typescript

  semgrep:
    name: code (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@v7.0.1
      - run: semgrep scan --config p/typescript --config p/nodejsscan --config p/secrets --error --metrics off

  licences:
    name: licence report (not a gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      - run: pnpm licences:report licences-report.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: licences-report
          path: licences-report.md
