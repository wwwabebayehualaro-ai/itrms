# The service catalogue (task 0.21b): the 54 services of the reference design, by work process, with the source's
# Amharic text verbatim and our English (docs/service-catalogue.md, from Documents/; generated from it). A region's
# catalogue is seeded from this file (idempotent by code); a service is "not configured" until a service version is
# published for it. Codes are stable: forms, menus, unit types and cases name them.
services:
  - code: PT-01
    process: 2
    module: public-transport
    name:
      am: በዞኑ ውስጥ አዳዲስ መናኸሪያዎችን መገንባትና በትራንስፖርትና መንገድ ልማት አስተዳደር መምሪያ ስም የመናኸሪያ ባለቤትነት ፕላን ማሰራት
      en: Build new terminals (menahariya) in the zone and have terminal ownership plans prepared in the department's name
  - code: PT-02
    process: 2
    module: public-transport
    name:
      am: ዞኑን ከአጎራባች ዞኖች፣ ዞኑን ከወረዳ፣ ዞንን ከልዩ ወረዳ የሚያገናኙ አዳዲስ የስምሪት መስመሮችን መክፈት
