# Workspace layout: code-structure.md §2 (ADR-0032). The slice template is copied by the generator, never installed.
packages:
  - apps/*
  - platform/*
  - modules/*
  - packages/*
  - '!modules/_template'
allowBuilds:
  # @swc/core: its install script checks the native binary (the API bundle and the Vitest preset compile with swc)
  '@swc/core': true
  # @scarf/scarf (via @nestjs/swagger > swagger-ui-dist): an install-time analytics ping; never run
  '@scarf/scarf': false
  # Testcontainers' Docker client (dev only): optional native speed-ups with pure-JavaScript fallbacks; never run
  cpu-features: false
  protobufjs: false
  ssh2: false
  # @parcel/watcher (via next-intl) and msgpackr-extract (via bullmq): their install scripts only compile from source when
  # no prebuilt platform package fits; the prebuilt ones load without them. Never run
  '@parcel/watcher': false
  msgpackr-extract: false
  esbuild: true
  lefthook: true
  unrs-resolver: true
# The tech-stack version rule (releases at least two weeks old) also for manual `pnpm add`, not only Renovate. Minutes.
minimumReleaseAge: 20160
# seroval (via @tanstack/react-query-devtools, dev only) below 1.6.3 has GHSA-p6vx-979v-rg4c (critical) and
# GHSA-jp82-f5mq-hwhp: pinned to a fixed release at least two weeks old. Remove once the devtools depend on it.
overrides:
  seroval: 1.6.8
  seroval-plugins: 1.6.8
  # fastify below 5.12.2 has four high advisories (validation, header and auth bypasses); @nestjs/platform-fastify 11.2.7
  # pins 5.11.3. Remove when a NestJS 11 release depends on a fixed version.
  fastify@5: 5.12.5
  # @nestjs/cli (the API build, dev only) pins glob 11.0 (CLI command injection) and picomatch 4.0.3 (ReDoS)
  '@nestjs/cli>glob': 13.0.6
  picomatch@4: 4.0.7
auditConfig:
  ignoreGhsas:
    # braces (via eslint-config-next → micromatch, lint time only): no fixed release yet. It expands the repository's own
    # glob patterns, never user input. Tracked as a follow-up of task 0.4; remove when a fix ships.
    - GHSA-vfj7-8cjw-p6xm
