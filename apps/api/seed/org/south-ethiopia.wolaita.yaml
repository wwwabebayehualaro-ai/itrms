# The org tree of the reference design (tenant-wolaita.md §2, org-and-unit-types.md §3): South Ethiopia Region → Wolaita
# Zone → its 16 woredas and the town administrations known so far, as siblings under the zone. Data, not code: another
# zone is another file (`pnpm --filter @itrms/api seed:org <file>`). Running it again changes nothing.
#
# Sources: [D] the zone's documents (Form 15 cover pages: Damot Gale ምድብ 1, Boditi ፈርጅ 1, Gesuba ፈርጅ 3, Bitena ፈርጅ 4),
# [N] the zone's website (English spellings). `toConfirm` lists what the zone confirms in the org admin screen: the
# official Amharic spellings, the Wolaytta names, the categories and grades, and the provisional unit types.
# Categories: m<n> = woreda category (ምድብ n), f<n> = town grade (ፈርጅ n).

region:
  code: SER
  type: regional_bureau
  name: { am: የደቡብ ኢትዮጵያ ክልል, en: South Ethiopia Regional State, wal-Latn: South Ethiopia Regional State }
  toConfirm: [name.wal-Latn]

levels:
  - { key: region, rank: 1, name: { am: ክልል, en: Region } }
  - { key: zone, rank: 2, name: { am: ዞን, en: Zone } }
  - { key: woreda, rank: 3, name: { am: ወረዳ, en: Woreda } }
  - { key: town, rank: 3, name: { am: ከተማ አስተዳደር, en: Town administration } }

# The teams of a unit (Form 15), one per work process; `x-` keys are YAML anchors only, not imported
x-teams:
  support: &support { key: support, name: { am: ኃላፊና ድጋፍ ሰጪ, en: Head and support } }
  road_safety:
    &road_safety { key: road_safety, process: road_safety, name: { am: የመንገድ ትራፊክ ደህንነት, en: Road traffic safety } }
  public_transport:
    &public_transport {
      key: public_transport,
      process: public_transport,
      name: { am: የህዝብ ትራንስፖርት, en: Public transport }
    }
  competency:
    &competency {
      key: competency,
      process: competency,
      name: { am: የአሽከርካሪና ተሽከርካሪ ብቃት ማረጋገጫ, en: Driver and vehicle competency }
    }
  freight: &freight { key: freight, process: freight, name: { am: የጭነት ትራንስፖርት, en: Freight transport } }
  road_quality:
    &road_quality { key: road_quality, process: road_quality, name: { am: የመንገድ ጥራት ቁጥጥር, en: Road quality control } }
  design_contracts:
    &design_contracts {
      key: design_contracts,
      process: design_contracts,
      name: { am: የዲዛይንና ኮንትራት አስተዳደር, en: Design and contract management }
    }
  logistics: &logistics { key: logistics, process: logistics, name: { am: የሎጂስቲክስ አቅርቦት, en: Logistics supply } }
  community:
    &community { key: community, process: community, name: { am: የህዝብ ተሳትፎና ባለድርሻ አካላት, en: Community participation } }

unitTypes:
  # the bureau configures services and administers the region; it decides no cases [A: roles-and-permissions.md §1]
  - key: regional_bureau
    nonDelegableRoles: [bureau_admin, unit_admin]
    level: region
    name: { am: የክልል ትራንስፖርትና መንገድ ልማት ቢሮ, en: Regional transport and road development bureau }
    capabilities: [prints_documents]
    roles: [bureau_admin, unit_admin, unit_head, auditor, viewer]

  - key: zone_department
    nonDelegableRoles: [unit_admin]
    level: zone
    name: { am: የዞን ትራንስፖርትና መንገድ ልማት መምሪያ, en: Zone transport and road development department }
    capabilities: [collects_cash, prints_documents, has_examiners]
    services:
      [PT-01..06, RS-01..07, DVC-01..11, FR-01..03, RQ-01..02, DC-01..07, CP-01..05, LG-01..03, HR-01..06, PB-01..04]
    roles:
      [
        unit_admin,
        unit_head,
        records_officer,
        cashier,
        finance_officer,
        auditor,
        viewer,
        competency.officer,
        competency.lead,
        competency.examiner,
        competency.inspector,
        public_transport.officer,
        public_transport.lead,
        freight.officer,
        freight.lead,
        road_safety.officer,
        road_safety.lead,
        road_quality.officer,
        road_quality.lead,
        design_contracts.officer,
        design_contracts.lead,
        design_contracts.contract_admin,
        community.officer,
        community.lead,
        logistics.officer,
        logistics.lead,
        logistics.machinery_operator,
        hr.officer,
        hr.lead,
        hr.payroll_officer,
        hr.payroll_approver,
        planning.officer,
        planning.lead
      ]
    departments:
      [
        *support,
        *road_safety,
        *public_transport,
        *competency,
        *freight,
        *road_quality,
        *design_contracts,
        *logistics,
        *community
      ]

  - key: town_unit_f1
    nonDelegableRoles: [unit_admin]
    level: town
    name: { am: የፈርጅ 1 ከተማ ትራንስፖርትና ሎጂስቲክስ አገልግሎት ዩኒት, en: Grade 1 town transport and logistics service unit }
    categories: [f1]
    capabilities: [collects_cash, runs_terminal, prints_documents, has_examiners]
    services: [RS-01..07, DVC-01..11, FR-01..03, PT-01..06]
    roles:
      [
        unit_admin,
        unit_head,
        records_officer,
        cashier,
        finance_officer,
        auditor,
        viewer,
        competency.officer,
        competency.lead,
        competency.examiner,
        competency.inspector,
        freight.officer,
        freight.lead,
        public_transport.officer,
        public_transport.lead,
        road_safety.officer,
        road_safety.lead
      ]
    departments: [*road_safety, *competency, *freight, *public_transport]

  - key: woreda_office_m1
    nonDelegableRoles: [unit_admin]
    level: woreda
    name: { am: የምድብ 1 ወረዳ ትራንስፖርትና መንገድ ልማት ጽ/ቤት, en: Category 1 woreda transport and road development office }
    categories: [m1]
    capabilities: []
    services: [RS-01..07, PT-04, PT-06, RQ-01..02, DC-01..07, LG-01..03, CP-01..05, HR-01..06, PB-02]
    roles:
      [
        unit_admin,
        unit_head,
        records_officer,
        cashier,
        finance_officer,
        auditor,
        viewer,
        road_safety.officer,
        road_safety.lead,
        public_transport.officer,
        public_transport.lead,
        road_quality.officer,
        road_quality.lead,
        design_contracts.officer,
        design_contracts.lead,
        design_contracts.contract_admin,
        logistics.officer,
        logistics.lead,
        logistics.machinery_operator,
        community.officer,
        community.lead,
        hr.officer,
        hr.lead,
        hr.payroll_officer,
        hr.payroll_approver,
        planning.officer,
        planning.lead
      ]
    departments: [*support, *road_safety, *public_transport, *road_quality, *design_contracts, *logistics, *community]

  # provisional [A]: only the cover pages were scanned
  - key: town_unit_f3
    nonDelegableRoles: [unit_admin]
    level: town
    name: { am: የፈርጅ 3 ከተማ ትራንስፖርትና ሎጂስቲክስ ዩኒት, en: Grade 3 town transport and logistics unit }
    categories: [f3]
    capabilities: [collects_cash]
    services: [RS-01..07, PT-01..06]
    roles:
      [
        unit_admin,
        unit_head,
        records_officer,
        cashier,
        finance_officer,
        auditor,
        viewer,
        road_safety.officer,
        road_safety.lead,
        public_transport.officer,
        public_transport.lead
      ]
    departments: [*road_safety, *public_transport]

  - key: town_unit_f4
    nonDelegableRoles: [unit_admin]
    level: town
    name: { am: የፈርጅ 4 ከተማ ትራንስፖርትና ሎጂስቲክስ ዩኒት, en: Grade 4 town transport and logistics unit }
    categories: [f4]
    capabilities: [collects_cash]
    services: [RS-01..07, PT-01..06]
    roles:
      [
        unit_admin,
        unit_head,
        records_officer,
        cashier,
        finance_officer,
        auditor,
        viewer,
        road_safety.officer,
        road_safety.lead,
        public_transport.officer,
        public_transport.lead
      ]
    departments: [*road_safety, *public_transport]

