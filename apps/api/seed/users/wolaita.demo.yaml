# Demo users of the reference design (roles-and-permissions.md §4): generated, role-descriptive names, never real people.
# `keycloakSub` is the Keycloak account id; the realm's demo users get the same ids (task 0.10a). Applied after the org seed
# by `pnpm --filter @itrms/api seed:users seed/users/wolaita.demo.yaml`; running it again changes nothing.
